# Fork CI for lime/kanban-code, run by the Linux gitea-runner.
#
# Gitea reads .gitea/workflows when it exists and then ignores .github/workflows,
# so this file stands in for upstream's workflows. Those are left untouched so
# upstream merges stay free of conflicts. Most of them only make sense on GitHub
# (release-please, macOS release builds, cross-repo dispatch).
#
# What Linux can check:
#   - swift:   KanbanCodeCore, the server targets and their tests (as upstream's
#              linux-ci.yml). The SwiftUI/AppKit app and SwiftTerm need macOS.
#   - windows: the Tauri crate's `cargo test` and the frontend's `tsc && vite build`.
#   - cli:     the TypeScript CLI's build and tests (as upstream's cli-ci.yml).
#
# Fix branches headed upstream don't carry this file, so pushes to them don't
# trigger it. To check one, run this workflow by hand (Actions → Fork CI →
# Run workflow) and give the branch name as `ref`.
name: Fork CI

on:
  push:
    # main only: ci/gitea-linux carries the same commits, and a push to both
    # would queue two identical runs on the one runner.
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'LocalPackages/**'
      - 'windows/**'
      - 'cli/**'
      - '.gitea/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to check (empty = the branch you run from)'
        required: false
        default: ''

jobs:
  # Job images come from common/ci-images, rebuilt weekly; Renovate raises a PR
  # when a newer date tag exists. ci-swift is swift:6.2-noble plus Node (for
  # actions), tmux and git (for the real-tmux / real-git tests).
  swift:
    runs-on: ubuntu-latest
    container:
      image: gitea-hl.taild204f.ts.net/common/ci-swift:20261119
      volumes:
        # SwiftPM's dependency cache, so packages aren't re-cloned every run.
        - swiftpm-cache:/root/.cache/org.swift.swiftpm
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Build
        run: swift build --build-tests

      # Advisory for now. Upstream's Linux CI has never got past its build
      # (it has failed since it was added on 2026-09-28), so the Swift tests
      # have never been run on Linux, and run in parallel here they deadlock:
      # every test starts and none finishes. Serially and under a hard time
      # limit, the log names any test that hangs, and the build steps above
      # and below stay the real check.
      #
      # A watchdog fails the step after 3 minutes without output, printing the
      # last lines so the log names the test that hung, instead of the job
      # sitting silent until its timeout. It's inline rather than a script
      # file because a manual run checks out a fix branch, which doesn't carry
      # .gitea/. Lines are trimmed: Swift Testing prints each parameterised
      # case's argument, SecretDetectorTests passes inputs over 64 KB, and
      # act_runner stops reading job output at a line that long.
      - name: Test (advisory, serial, watchdog)
        continue-on-error: true
        shell: bash
        run: |
          echo "CPUs: $(nproc)"
          idle_limit=180
          log=$(mktemp)
          # stdbuf: written to a file, test output is block-buffered, so the
          # last lines the watchdog shows would lag the test that actually hung.
          # Skipped: hangs on Linux (found 2026-11-19). It starts a real tmux
          # server with Process and waitUntilExit, and the daemonised server
          # appears to keep Foundation from ever seeing the client exit.
          stdbuf -oL -eL swift test --skip-build --no-parallel \
            --skip tmuxServerDropsInheritedVariables >"$log" 2>&1 &
          pid=$!
          tail -n +1 -f "$log" | while IFS= read -r line; do printf '%s\n' "${line:0:2000}"; done &
          tailer=$!
          last_size=-1; idle=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            size=$(stat -c %s "$log")
            if [ "$size" = "$last_size" ]; then idle=$((idle + 10)); else idle=0; last_size=$size; fi
            if [ "$idle" -ge "$idle_limit" ]; then
              sleep 1; kill "$tailer" 2>/dev/null
              echo "::error::watchdog: no test output for ${idle_limit}s, so the suite looks hung. Last lines:"
              tail -n 15 "$log" | cut -c1-2000
              kill -TERM "$pid" 2>/dev/null; sleep 10; kill -KILL "$pid" 2>/dev/null
              exit 124
            fi
          done
          wait "$pid"; status=$?
          sleep 1; kill "$tailer" 2>/dev/null
          exit "$status"

      - name: Build kanban-code-server (release)
        run: swift build -c release --product kanban-code-server --static-swift-stdlib

  # ci-tauri carries Node 24, the WebKitGTK libraries Tauri links against on
  # Linux, mingw-w64, and Rust stable with the x86_64-pc-windows-gnu target.
  windows:
    runs-on: ubuntu-latest
    container:
      image: gitea-hl.taild204f.ts.net/common/ci-tauri:20261119
      volumes:
        - npm-cache:/opt/npm-cache
        # Downloaded crates (never mount over CARGO_HOME, which holds the toolchain).
        - cargo-registry:/usr/local/cargo/registry
        # Build caching: compiled dependencies persist between runs, so only
        # the app crate rebuilds. Cargo locks the directory, so overlapping
        # runs wait for each other rather than corrupt it.
        - kanban-code-cargo-target:/opt/cargo-target
    env:
      CARGO_TARGET_DIR: /opt/cargo-target
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      # tauri::generate_context! needs ../dist to exist, so build the frontend first.
      - name: Frontend build (tsc && vite build)
        working-directory: windows
        run: |
          npm ci
          npm run build

      - name: cargo test
        working-directory: windows/src-tauri
        run: cargo test

      # cargo test above builds for Linux, so the code marked
      # #[cfg(windows)] / #[cfg(target_os = "windows")] is never compiled.
      # Type-checking for a Windows target compiles it without needing
      # Windows. mingw-w64 (in ci-tauri) supplies the C cross-compiler that
      # ring's build script needs and the windres that tauri-build uses.
      # Advisory until tauri-build's Windows resource step works on the Linux
      # runner: on 2026-11-19 it failed looking for resource.lib before any of
      # the app's own code was checked.
      - name: Type-check for Windows (advisory, cargo check --target x86_64-pc-windows-gnu)
        continue-on-error: true
        working-directory: windows/src-tauri
        run: cargo check --target x86_64-pc-windows-gnu --all-targets

  # ci-base: Ubuntu 24.04 with Node 24, tmux and git.
  cli:
    runs-on: ubuntu-latest
    container:
      image: gitea-hl.taild204f.ts.net/common/ci-base:20261119
      volumes:
        - npm-cache:/opt/npm-cache
        - pnpm-store:/opt/pnpm-store
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Install pnpm and dependencies
        run: |
          npm install -g pnpm@10.30.3
          pnpm install --frozen-lockfile

      - name: Typecheck / build
        run: pnpm run build

      - name: Test
        run: pnpm test
